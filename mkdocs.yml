site_name: 嘴强黑客 / pbuff07
site_description: 赛博空间嘴强王者
site_author: pbuff07
site_url: https://pbuff.cc/

copyright: Copyright &copy; 2021–2026 pbuff07

theme:
  name: material
  language: zh
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang:
        - zh
        - en
  - tags:
      listings_toc: false
  - blog:
      blog_dir: .
      blog_toc: false
      post_date_format: full
      post_url_date_format: yyyy/MM/dd
      post_url_format: "{date}/{slug}"
      post_readtime: false
      authors: false
      categories: true
      categories_name: 分类
      categories_url_format: "category/{slug}"
      categories_allowed:
        - AI 工程
        - 网络安全
        - 网络协议
        - 数据库
        - 系统运维
        - 数据处理与自动化
        - 技术杂谈与科普
        - 生活与阅读
        - 路亚日记
      archive: true
      archive_name: 归档
      archive_date_format: yyyy
      archive_url_date_format: yyyy
      archive_url_format: "archive/{date}"
      pagination: true
      pagination_per_page: 10
  - rss:
      match_path: posts/.*
      use_git: false
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/archive-sidebar.js
  - javascripts/tags-index.js

