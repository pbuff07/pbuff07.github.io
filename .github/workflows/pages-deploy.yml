name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: |
          mkdocs build --clean
          touch site/.nojekyll
          cp -f CNAME site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # 兼容「Deploy from a branch」：把静态站点写到 main 根目录
      - name: Publish site to main root
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: main
          clean: true
          force: false
          commit-message: "Deploy MkDocs site [skip ci]"
          clean-exclude: |
            .editorconfig
            .gitattributes
            .github
            .gitignore
            .vscode
            CNAME
            LICENSE
            README.md
            docs
            mkdocs.yml
            overrides
            requirements.txt
            assets
            content
            layouts
            public
            static
            hugo.toml

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
