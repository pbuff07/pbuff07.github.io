name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: |
          mkdocs build --clean
          touch site/.nojekyll
          cp -f CNAME site/CNAME

      # username.github.io 当前若仍是「Deploy from a branch / main」，
      # 必须把构建产物写到 main 根目录，否则会回退成 Jekyll 渲染 README。
      - name: Publish site to main root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: main
          clean: true
          force: false
          commit-message: "Deploy MkDocs site [skip ci]"
          clean-exclude: |
            .editorconfig
            .gitattributes
            .github
            .gitignore
            .vscode
            CNAME
            LICENSE
            README.md
            docs
            mkdocs.yml
            overrides
            requirements.txt
            assets
            content
            layouts
            public
            static
            hugo.toml
