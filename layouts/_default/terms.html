{{ define "main" }}
  <section class="listing">
    <h1>{{ .Title }}</h1>
    <ul class="terms">
      {{ range .Data.Terms.Alphabetical }}
        <li>
          <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
          <span>{{ .Count }}</span>
        </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
