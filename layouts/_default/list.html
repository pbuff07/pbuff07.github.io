{{ define "main" }}
  <section class="listing">
    <h1>{{ .Title }}</h1>
    <ul>
      {{ range .Pages.ByDate.Reverse }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ if not .Date.IsZero }}
            <time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format "2006-01-02" }}</time>
          {{ end }}
        </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
